<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><title>Film motoru deneme</title>
<link rel="stylesheet" href="css/fonts.css">
<style>body{margin:0;background:#111;color:#ddd;font:14px Inter,sans-serif}canvas{display:block;max-height:92vh;margin:10px auto}</style></head>
<body><canvas id="cv"></canvas>
<script type="module">
import { Film } from './js/film/player.js';
import { direct } from './js/film/director.js';
import { encodeFast } from './js/encoder.js';
import { analyzeAudio } from './js/film/analyze.js';
import { mixFor } from './js/audio.js';
const cv = document.getElementById('cv');
const W = +(new URLSearchParams(location.search).get('w') || 720), H = +(new URLSearchParams(location.search).get('h') || 1280);
cv.width = W; cv.height = H;
const film = new Film(cv, W, H);
await Promise.all(['700 40px Amiri', '400 40px Amiri', '700 40px "Playfair Display"', '500 40px Lora', 'italic 500 40px Lora', '600 30px Inter', '800 40px Montserrat', '400 40px "Amiri Quran"'].map(f => document.fonts.load(f, 'Ağış بسم ٱلۡ')));
window.lab = {
  film, direct, analyzeAudio,
  setup(items, style, o = {}) {
    film.setStyle(style, o.styleOpts || {});
    if (o.fonts) Object.assign(film.fonts, o.fonts);
    film.beats = o.beats || null;
    const tl = direct(items, { style, seed: o.seed || 1, pace: o.pace || 1, beats: o.beats, template: o.template });
    film.setTimeline(tl); return tl;
  },
  frame(t) { film.render(t); return true; },
  async encode(dur, fps = 30, audio = null) {
    const res = await encodeFast({ canvas: cv, W, H, fps, dur, bitrate: W * H * fps * 0.12, audio, renderAt: async t => film.render(t), onProgress: () => {}, cancelled: () => false });
    const b = await res.blob.arrayBuffer(); let s = ''; const u = new Uint8Array(b); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
    return btoa(s);
  }
};
// sentez müzik: yumuşak pad + kick (ritim analizi denemesi için)
async function synth(dur, bpm, kind) {
  const sr = 48000, oc = new OfflineAudioContext(2, Math.ceil(dur * sr), sr);
  const master = oc.createGain(); master.gain.value = 0.5; master.connect(oc.destination);
  const chords = kind === 'warm' ? [[220, 277.2, 329.6], [196, 246.9, 293.7], [174.6, 220, 261.6], [196, 246.9, 329.6]] : [[146.8, 174.6, 220], [130.8, 164.8, 196], [116.5, 146.8, 174.6], [130.8, 155.6, 196]];
  const bar = 60 / bpm * 4;
  for (let b = 0; b * bar < dur; b++) for (const f of chords[b % 4]) for (const det of [-4, 4]) {
    const o = oc.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = det;
    const lp = oc.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; const g = oc.createGain();
    const t0 = b * bar; g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.035, t0 + 0.8); g.gain.setValueAtTime(0.035, t0 + bar - 0.4); g.gain.linearRampToValueAtTime(0, t0 + bar + 0.3);
    o.connect(lp).connect(g).connect(master); o.start(t0); o.stop(t0 + bar + 0.4);
  }
  const beat = 60 / bpm;
  for (let i = 0; i * beat < dur; i++) {
    const t0 = i * beat; const o = oc.createOscillator(); const g = oc.createGain(); o.frequency.setValueAtTime(110, t0); o.frequency.exponentialRampToValueAtTime(40, t0 + 0.18);
    g.gain.setValueAtTime(i % 4 === 0 ? 0.9 : 0.55, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.35); o.connect(g).connect(master); o.start(t0); o.stop(t0 + 0.4);
    if (kind !== 'warm' && i % 2 === 1) { const n = oc.createBufferSource(); const nb = oc.createBuffer(1, sr * 0.1, sr); const d = nb.getChannelData(0); for (let k = 0; k < d.length; k++) d[k] = (Math.random() * 2 - 1) * Math.exp(-k / (sr * 0.02)); n.buffer = nb; const hp = oc.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 5000; const gg = oc.createGain(); gg.gain.value = 0.25; n.connect(hp).connect(gg).connect(master); n.start(t0); }
  }
  return await oc.startRendering();
}
lab.synth = synth; lab.mixFor = mixFor;
lab.sample = async (items, style, bpm, kind, seed) => {
  const music = await synth(60, bpm, kind);
  const an = analyzeAudio(music);
  const tl = lab.setup(items, style, { seed, beats: an.beats });
  const audio = await mixFor(music, tl.dur, { volume: 0.8, fadeIn: true, fadeOut: true, loop: true }, 0);
  const b64 = await lab.encode(tl.dur, 30, audio);
  return { b64, bpm: an.bpm, nBeats: an.beats.length, dur: tl.dur, shots: tl.shots.map(s => [s.scene, s.camera, s.anim, s.transition, +s.start.toFixed(2), +s.dur.toFixed(2)]) };
};
window.ready = true;
</script></body></html>
